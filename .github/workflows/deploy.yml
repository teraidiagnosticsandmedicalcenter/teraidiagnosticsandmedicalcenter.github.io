name: CI/CD Pipeline (Build, GitHub Pages & IONOS VPS Deploy)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "deploy-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. CI - Build & Validate Front-End
  # =========================================================================
  build:
    name: Build & Validate React Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Static Production Assets
        run: npm run build

      - name: Setup GitHub Pages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # =========================================================================
  # 2. CD - Deploy to GitHub Pages (Serves immediate redirect to domain)
  # =========================================================================
  deploy-github-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # =========================================================================
  # 3. CD - Zero-Downtime Deploy to IONOS VPS
  # =========================================================================
  deploy-vps:
    name: Zero-Downtime Deploy to IONOS VPS
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Execute Remote Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            if [ ! -d /opt/teraidiagnostics ]; then
              git clone https://github.com/teraidiagnosticsandmedicalcenter/teraidiagnosticsandmedicalcenter.github.io.git /opt/teraidiagnostics
            fi
            cd /opt/teraidiagnostics
            git config --global --add safe.directory /opt/teraidiagnostics
            git fetch origin main
            git reset --hard origin/main
            chmod +x scripts/deploy_production.sh
            bash scripts/deploy_production.sh
