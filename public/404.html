<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Terai Diagnostic &amp; Medical Center - Birgunj, Nepal</title>
    <meta name="robots" content="noindex">
    <script type="text/javascript">
      // SPA Deep-Link Redirect Handler for GitHub Pages & Static Hosts
      (function() {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        
        // If deep path was requested (e.g. /tests/blood-sugar-fasting), preserve it via query param ?p=
        var redirectUrl = window.location.protocol + '//' + 
                          window.location.hostname + 
                          (window.location.port ? ':' + window.location.port : '') + 
                          '/?p=' + encodeURIComponent(path) + 
                          (search ? '&' + search.slice(1) : '') + 
                          hash;
        window.location.replace(redirectUrl);
      })();
    </script>
  </head>
  <body style="font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f8fafc; color: #334155;">
    <div style="text-align: center; padding: 20px;">
      <h2>Loading Terai Diagnostic &amp; Medical Center...</h2>
      <p>Redirecting to requested test or page.</p>
    </div>
  </body>
</html>
